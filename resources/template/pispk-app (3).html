<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIS-PK — Pendataan Keluarga Sehat</title>
<style>
  :root{
    --ink:#16302A;
    --ink-soft:#41564F;
    --paper:#EFF3EE;
    --paper-raised:#FFFFFF;
    --line:#D6DFD5;
    --primary:#145C54;
    --primary-dark:#0D3F3A;
    --primary-tint:#DCEAE6;
    --clay:#AE4E2E;
    --clay-tint:#F5E3DB;
    --amber:#B4842A;
    --amber-tint:#F3E9D4;
    --success:#3D7A52;
    --success-tint:#DEEBE1;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  h1,h2,h3,h4{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-weight:600;
    color:var(--primary-dark);
    margin:0 0 4px 0;
  }
  #app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:216px;flex:0 0 216px;background:var(--primary-dark);color:#EAF2EF;
    padding:22px 14px;display:flex;flex-direction:column;gap:2px;
  }
  .brand{padding:0 8px 20px 8px;}
  .brand .mark{font-family:Georgia,serif;font-size:20px;font-weight:700;color:#fff;letter-spacing:0.3px;}
  .brand .sub{font-size:11.5px;color:#9FC1B6;margin-top:3px;line-height:1.4;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
    cursor:pointer;color:#CFE3DC;font-size:14px;border:none;background:none;text-align:left;width:100%;
    font-family:inherit;
  }
  .nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .nav-item.active{background:var(--primary);color:#fff;}
  .nav-icon{width:18px;text-align:center;font-size:15px;}
  .sidebar-foot{margin-top:auto;padding:12px 8px 0 8px;border-top:1px solid rgba(255,255,255,0.12);}
  .mode-pill{
    display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#B9D6CC;
    background:rgba(255,255,255,0.06);padding:5px 9px;border-radius:20px;cursor:pointer;
  }

  /* Main */
  .main{flex:1;min-width:0;padding:26px 34px 60px 34px;}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .topbar p{margin:2px 0 0 0;color:var(--ink-soft);font-size:13.5px;}

  .btn{
    font-family:inherit;font-size:13.5px;border:1px solid var(--primary);background:var(--primary);
    color:#fff;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600;
  }
  .btn:hover{background:var(--primary-dark);}
  .btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--line);}
  .btn.ghost:hover{border-color:var(--primary);background:var(--primary-tint);}
  .btn.danger{background:transparent;color:var(--clay);border:1px solid var(--clay);}
  .btn.danger:hover{background:var(--clay-tint);}
  .btn.small{padding:6px 11px;font-size:12.5px;}
  .btn:disabled{opacity:0.5;cursor:default;}

  .card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px;}
  .stat-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .stat-card .num{font-family:Georgia,serif;font-size:28px;color:var(--primary-dark);font-weight:700;}
  .stat-card .lbl{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;}
  .badge.sehat{background:var(--success-tint);color:var(--success);}
  .badge.pra{background:var(--amber-tint);color:var(--amber);}
  .badge.tidak{background:var(--clay-tint);color:var(--clay);}
  .badge.na{background:#E7E7E2;color:#71716A;}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:0.4px;color:var(--ink-soft);
     border-bottom:1px solid var(--line);padding:8px 10px;font-weight:600;}
  td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top;}
  tr:hover td{background:#F7FAF7;}
  .row-actions{display:flex;gap:6px;}

  .search-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{
    font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    background:#fff;color:var(--ink);width:100%;
  }
  textarea{resize:vertical;min-height:90px;}
  label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}
  .field{margin-bottom:14px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:0.5px;color:var(--primary);
     font-weight:700;margin:26px 0 12px 0;border-bottom:1px solid var(--line);padding-bottom:6px;}
  .section-title:first-child{margin-top:0;}

  .member-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:10px;}
  .indicator-item{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:#fbfcfa;}
  .indicator-item .q{font-size:14px;font-weight:600;margin-bottom:8px;}
  .indicator-item .domain{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:3px;}
  .yn{display:flex;gap:8px;flex-wrap:wrap;}
  .yn label{display:flex;align-items:center;gap:5px;font-weight:500;font-size:13px;color:var(--ink);
    border:1px solid var(--line);padding:6px 12px;border-radius:20px;cursor:pointer;background:#fff;margin:0;}
  .yn input{margin:0;}
  .yn label.sel-y{border-color:var(--success);background:var(--success-tint);color:var(--success);}
  .yn label.sel-t{border-color:var(--clay);background:var(--clay-tint);color:var(--clay);}
  .yn label.sel-n{border-color:#B7B7AE;background:#EFEFE9;color:#6B6B62;}

  .ai-box{border:1.5px dashed var(--primary);background:var(--primary-tint);border-radius:var(--radius);padding:20px;margin-bottom:22px;}
  .ai-box h3{margin-bottom:6px;}
  .ai-box p{color:var(--ink-soft);font-size:13.5px;margin-top:0;}
  .ai-status{font-size:13px;color:var(--primary-dark);margin-top:10px;font-weight:600;}
  .ai-flag{background:var(--amber-tint);color:var(--amber);border-radius:6px;padding:2px 8px;font-size:11px;margin-left:6px;}

  .import-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .import-tab{font-family:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--paper-raised);
    color:var(--ink-soft);padding:9px 15px;border-radius:8px;cursor:pointer;font-weight:600;}
  .import-tab:hover{border-color:var(--primary);color:var(--primary-dark);}
  .import-tab.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .excel-box{border:1.5px dashed var(--primary);background:var(--primary-tint);border-radius:var(--radius);padding:20px;margin-bottom:22px;}
  .excel-box h3{margin-bottom:6px;}
  .excel-box p{color:var(--ink-soft);font-size:13.5px;margin-top:0;}
  .excel-dropzone{border:1.5px dashed var(--line);background:var(--paper-raised);border-radius:8px;
    padding:22px;text-align:center;cursor:pointer;margin-top:12px;}
  .excel-dropzone:hover{border-color:var(--primary);background:var(--primary-tint);}
  .excel-dropzone .big{font-size:26px;margin-bottom:6px;}
  .excel-filename{font-size:13px;color:var(--primary-dark);font-weight:600;margin-top:10px;}
  .excel-progress{margin-top:10px;}
  .excel-progress-track{background:var(--line);border-radius:20px;height:8px;overflow:hidden;margin-top:6px;}
  .excel-progress-fill{background:var(--primary);height:100%;transition:width .2s;}
  .draft-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 14px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--paper-raised);}
  .draft-row.failed{border-color:var(--clay);background:var(--clay-tint);}
  .draft-row .info strong{display:block;}
  .draft-row .info span{color:var(--ink-soft);font-size:12.5px;}
  .draft-row .actions{display:flex;gap:6px;flex-shrink:0;}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty .big{font-size:38px;margin-bottom:10px;}

  .bars{display:flex;flex-direction:column;gap:10px;}
  .bar-row{display:grid;grid-template-columns:200px 1fr 42px;align-items:center;gap:10px;}
  .bar-row .name{font-size:13px;color:var(--ink);}
  .bar-track{background:#E4E9E3;border-radius:6px;height:10px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--primary);}
  .bar-row .pct{font-size:12.5px;color:var(--ink-soft);text-align:right;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(15,30,26,0.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:#fff;border-radius:12px;padding:24px;max-width:420px;width:100%;}
  .modal p{color:var(--ink-soft);font-size:14px;}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  .toast{position:fixed;bottom:22px;right:22px;background:var(--primary-dark);color:#fff;padding:12px 18px;
    border-radius:8px;font-size:13.5px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,0.2);}

  .form-actions{display:flex;gap:10px;margin-top:22px;position:sticky;bottom:0;background:linear-gradient(to top, var(--paper) 70%, transparent);padding:14px 0 4px 0;}

  @media(max-width:820px){
    #app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:12px;}
    .brand,.sidebar-foot{display:none;}
    .nav-item{flex-direction:column;font-size:11px;gap:3px;white-space:nowrap;}
    .main{padding:18px;}
    .field-row,.field-row3{grid-template-columns:1fr;}
    .member-row{grid-template-columns:1fr 1fr;}
    .bar-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ============================= DATA MODEL ============================= */

const INDICATORS = [
  {id:'kb', domain:'KB & Kesehatan Ibu-Anak', q:'Keluarga mengikuti program Keluarga Berencana (KB)'},
  {id:'bersalin', domain:'KB & Kesehatan Ibu-Anak', q:'Ibu melakukan persalinan di fasilitas kesehatan'},
  {id:'imunisasi', domain:'KB & Kesehatan Ibu-Anak', q:'Bayi mendapat imunisasi dasar lengkap'},
  {id:'asi', domain:'KB & Kesehatan Ibu-Anak', q:'Bayi mendapat Air Susu Ibu (ASI) eksklusif'},
  {id:'balita', domain:'KB & Kesehatan Ibu-Anak', q:'Pertumbuhan balita dipantau tiap bulan'},
  {id:'tb', domain:'Pengendalian Penyakit', q:'Penderita tuberkulosis paru berobat sesuai standar'},
  {id:'hipertensi', domain:'Pengendalian Penyakit', q:'Penderita hipertensi melakukan pengobatan secara teratur'},
  {id:'jiwa', domain:'Pengendalian Penyakit', q:'Penderita gangguan jiwa berat diobati dan tidak ditelantarkan'},
  {id:'rokok', domain:'Perilaku & Lingkungan', q:'Anggota keluarga tidak ada yang merokok'},
  {id:'jkn', domain:'Perilaku & Lingkungan', q:'Keluarga sudah menjadi anggota Jaminan Kesehatan Nasional (JKN)'},
  {id:'air', domain:'Perilaku & Lingkungan', q:'Keluarga mempunyai akses / menggunakan sarana air bersih'},
  {id:'jamban', domain:'Perilaku & Lingkungan', q:'Keluarga mempunyai akses / menggunakan jamban sehat'},
];

function blankIndicators(){
  const o = {};
  INDICATORS.forEach(i => o[i.id] = 'N');
  return o;
}

function blankFamily(){
  return {
    id: 'kk_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    no_kk:'', kepala_keluarga:'',
    alamat:{jalan:'', rt:'', rw:'', desa:'', kecamatan:''},
    anggota:[{nama:'', umur:'', jenis_kelamin:'L', hubungan:'Kepala Keluarga', nik:''}],
    indikator: blankIndicators(),
    flagged: {},
    catatan:'', surveyor:'', tanggal:'',
    updated_at: Date.now()
  };
}

function computeIKS(indikator){
  let y=0, t=0;
  INDICATORS.forEach(ind=>{
    const v = indikator[ind.id];
    if(v==='Y') y++;
    else if(v==='T') t++;
  });
  const denom = y+t;
  if(denom===0) return {score:null, label:'Belum Lengkap', cls:'na'};
  const score = y/denom;
  let label, cls;
  if(score > 0.8){label='Keluarga Sehat'; cls='sehat';}
  else if(score >= 0.5){label='Pra-Sehat'; cls='pra';}
  else {label='Tidak Sehat'; cls='tidak';}
  return {score, label, cls, y, t, n: 12-denom};
}

/* ============================= STATE ============================= */

const state = {
  view: 'dashboard',
  families: [],
  sharedMode: false,
  editingId: null,
  draftFamily: null,
  search: '',
  loaded: false,
  aiText: '',
  aiLoading: false,
  aiError: '',
  toast: '',
  confirmDeleteId: null,
  rekapExpand: {},
  rekapDefaultExpand: false,
  rekapFilterDesa: '',

  excelFileName: '',
  excelRawRows: [],
  excelLoading: false,
  excelError: '',
  excelProgress: {current:0, total:0},
  excelDrafts: [],       // {fam, ok, sourceRowLabel}
  excelEditIndex: null,  // index into excelDrafts currently being edited via the manual form
};

const STORAGE_KEY = 'pispk-families-v1';

async function loadFamilies(){
  try{
    const res = await window.storage.get(STORAGE_KEY, state.sharedMode);
    state.families = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    state.families = [];
  }
  state.loaded = true;
  render();
}

async function saveFamilies(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state.families), state.sharedMode);
  }catch(e){
    showToast('Gagal menyimpan data. Coba lagi.');
  }
}

function showToast(msg){
  state.toast = msg;
  render();
  setTimeout(()=>{ state.toast=''; render(); }, 2600);
}

/* ============================= HELPERS ============================= */

function esc(s){
  return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function alamatStr(a){
  return [a.jalan, a.rt?('RT '+a.rt):'', a.rw?('RW '+a.rw):'', a.desa, a.kecamatan].filter(Boolean).join(', ');
}
function fmtPct(x){ return (x*100).toFixed(0)+'%'; }

/* ============================= RENDER: SHELL ============================= */

function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    ${sidebarHtml()}
    <div class="main">
      ${topbarHtml()}
      ${viewHtml()}
    </div>
    ${state.confirmDeleteId ? deleteModalHtml() : ''}
    ${state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ''}
  `;
  attachEvents();
}

function sidebarHtml(){
  const items = [
    {id:'dashboard', icon:'&#9673;', label:'Dasbor'},
    {id:'list', icon:'&#9776;', label:'Data Keluarga'},
    {id:'rekap', icon:'&#128202;', label:'Rekap IKS Wilayah'},
    {id:'form', icon:'&#9998;', label:'Tambah Manual'},
    {id:'ai', icon:'&#10022;', label:'Tambah dengan AI'},
    {id:'excel', icon:'&#128196;', label:'Impor dari Excel'},
    {id:'indicators', icon:'&#10003;', label:'12 Indikator'},
  ];
  return `
  <div class="sidebar">
    <div class="brand">
      <div class="mark">PIS-PK</div>
      <div class="sub">Pendataan Keluarga Sehat<br>Pendekatan Keluarga</div>
    </div>
    ${items.map(it=>`
      <button class="nav-item ${state.view===it.id?'active':''}" data-nav="${it.id}">
        <span class="nav-icon">${it.icon}</span>${it.label}
      </button>`).join('')}
    <div class="sidebar-foot">
      <div class="mode-pill" data-action="toggle-mode" title="Klik untuk ganti mode penyimpanan">
        ${state.sharedMode ? '&#128101; Mode Tim (bersama)' : '&#128274; Mode Pribadi'}
      </div>
    </div>
  </div>`;
}

function topbarHtml(){
  const titles = {
    dashboard:['Dasbor Keluarga Sehat','Ringkasan capaian 12 indikator PIS-PK di wilayah kerja Anda.'],
    list:['Data Keluarga','Daftar keluarga yang telah didata, lengkap dengan status IKS.'],
    rekap:['Rekap IKS per Wilayah','Perhitungan Indeks Keluarga Sehat otomatis, berjenjang dari Desa, RW, RT, hingga per Kartu Keluarga.'],
    ai:['Tambah dengan Bantuan AI','Tempel catatan hasil kunjungan, biarkan AI menyusun data terstruktur.'],
    form:['Tambah / Ubah Data Keluarga','Isi data anggota keluarga dan capaian 12 indikator.'],
    excel:['Impor Data Keluarga dari Excel','Unggah file Excel/CSV berisi banyak keluarga sekaligus — AI yang memetakan kolomnya.'],
    indicators:['12 Indikator Keluarga Sehat','Rujukan indikator Program Indonesia Sehat dengan Pendekatan Keluarga.'],
  };
  const [t,sub] = titles[state.view] || titles.dashboard;
  let action = '';
  if(state.view==='list'){
    action = `<button class="btn" data-nav="form-new">+ Tambah Keluarga</button>`;
  }
  const inputTabs = ['form','ai','excel'].includes(state.view) ? `
    <div class="import-tabs">
      <button class="import-tab ${state.view==='form'?'active':''}" data-nav="form-new">&#9998; Manual</button>
      <button class="import-tab ${state.view==='ai'?'active':''}" data-nav="ai">&#10022; Dengan AI (catatan)</button>
      <button class="import-tab ${state.view==='excel'?'active':''}" data-nav="excel">&#128196; Impor Excel</button>
    </div>` : '';
  return `<div class="topbar"><div><h1>${t}</h1><p>${sub}</p></div>${action}</div>${inputTabs}`;
}

function viewHtml(){
  if(!state.loaded) return `<div class="empty">Memuat data&hellip;</div>`;
  if(state.view==='dashboard') return dashboardHtml();
  if(state.view==='list') return listHtml();
  if(state.view==='rekap') return rekapHtml();
  if(state.view==='ai') return aiHtml();
  if(state.view==='excel') return excelHtml();
  if(state.view==='form') return formHtml();
  if(state.view==='indicators') return indicatorsRefHtml();
  return '';
}

/* ============================= DASHBOARD ============================= */

function dashboardHtml(){
  const fams = state.families;
  if(fams.length===0){
    return `<div class="empty card"><div class="big">&#127968;</div>
      <h3>Belum ada data keluarga</h3>
      <p>Mulai dengan menambahkan data secara manual atau gunakan Asisten AI untuk mempercepat input.</p>
      <div style="margin-top:14px;display:flex;gap:10px;justify-content:center;">
        <button class="btn" data-nav="ai">Coba Input dengan AI</button>
        <button class="btn ghost" data-nav="form-new">Tambah Manual</button>
      </div>
    </div>`;
  }
  let sehat=0, pra=0, tidak=0, belum=0, scoreSum=0, scoreCount=0;
  fams.forEach(f=>{
    const r = computeIKS(f.indikator);
    if(r.cls==='sehat') sehat++;
    else if(r.cls==='pra') pra++;
    else if(r.cls==='tidak') tidak++;
    else belum++;
    if(r.score!==null){ scoreSum+=r.score; scoreCount++; }
  });
  const avg = scoreCount? (scoreSum/scoreCount) : 0;

  // per-indicator achievement
  const rows = INDICATORS.map(ind=>{
    let y=0,t=0;
    fams.forEach(f=>{
      const v=f.indikator[ind.id];
      if(v==='Y')y++; else if(v==='T')t++;
    });
    const denom=y+t;
    const pct = denom? y/denom : null;
    return {ind, pct, denom};
  });

  return `
  <div class="grid-cards">
    <div class="stat-card"><div class="num">${fams.length}</div><div class="lbl">Total Keluarga Didata</div></div>
    <div class="stat-card"><div class="num">${scoreCount? (avg*100).toFixed(0)+'%':'—'}</div><div class="lbl">Rata-rata Indeks Keluarga Sehat (IKS)</div></div>
    <div class="stat-card"><div class="num" style="color:var(--success)">${sehat}</div><div class="lbl">Keluarga Sehat (IKS &gt; 0.8)</div></div>
    <div class="stat-card"><div class="num" style="color:var(--amber)">${pra}</div><div class="lbl">Pra-Sehat (0.5–0.8)</div></div>
    <div class="stat-card"><div class="num" style="color:var(--clay)">${tidak}</div><div class="lbl">Tidak Sehat (&lt; 0.5)</div></div>
  </div>
  <div class="card">
    <h3>Capaian per Indikator</h3>
    <p style="color:var(--ink-soft);font-size:13px;margin-top:0;">Persentase "Ya" dari keluarga yang indikator tersebut berlaku.</p>
    <div class="bars">
      ${rows.map(r=>`

/* ============================= REKAP IKS WILAYAH ============================= */
/* Menghitung IKS secara otomatis dari data yang sudah diinput, dikelompokkan
   berjenjang: Desa -> RW -> RT -> per Kartu Keluarga (KK). Tidak memerlukan
   input tambahan — murni turunan dari data keluarga yang sudah ada. */

function iksStatsFor(fams){
  let sehat=0, pra=0, tidak=0, belum=0, scoreSum=0, scoreCount=0;
  fams.forEach(f=>{
    const r = computeIKS(f.indikator);
    if(r.cls==='sehat') sehat++;
    else if(r.cls==='pra') pra++;
    else if(r.cls==='tidak') tidak++;
    else belum++;
    if(r.score!==null){ scoreSum+=r.score; scoreCount++; }
  });
  return {n:fams.length, sehat, pra, tidak, belum, avg: scoreCount? (scoreSum/scoreCount) : null};
}

function buildWilayahTree(fams){
  const tree = {};
  fams.forEach(f=>{
    const desa = (f.alamat.desa||'').trim() || '(Tanpa Desa)';
    const rw = (f.alamat.rw||'').trim() || '(Tanpa RW)';
    const rt = (f.alamat.rt||'').trim() || '(Tanpa RT)';
    tree[desa] = tree[desa] || {};
    tree[desa][rw] = tree[desa][rw] || {};
    tree[desa][rw][rt] = tree[desa][rw][rt] || [];
    tree[desa][rw][rt].push(f);
  });
  return tree;
}

function isRekapExpanded(key){
  return (key in state.rekapExpand) ? state.rekapExpand[key] : state.rekapDefaultExpand;
}

function statRowHtml(label, fams, level, key, childrenFn){
  const st = iksStatsFor(fams);
  const cls = st.avg===null ? 'na' : (st.avg>0.8?'sehat':st.avg>=0.5?'pra':'tidak');
  const expanded = isRekapExpanded(key);
  const indent = level*20;
  const arrow = expanded ? '&#9662;' : '&#9656;';
  const childrenHtml = (expanded && childrenFn) ? childrenFn() : '';
  return `<tr data-rekap-toggle="${esc(key)}" style="cursor:pointer;">
    <td style="padding-left:${14+indent}px;font-weight:${level===0?'700':'500'};">
      <span style="display:inline-block;width:14px;color:var(--ink-soft);">${arrow}</span>${esc(label)}
    </td>
    <td>${st.n}</td>
    <td><span class="badge ${cls}">${st.avg===null?'—':fmtPct(st.avg)}</span></td>
    <td>${st.sehat}</td>
    <td>${st.pra}</td>
    <td>${st.tidak}</td>
  </tr>${childrenHtml}`;
}

function flattenRwMap(rwMap){
  return [].concat(...Object.values(rwMap).map(rtMap=>[].concat(...Object.values(rtMap))));
}

function renderDesaLevel(tree){
  return Object.keys(tree).sort().map(desa=>{
    const rwMap = tree[desa];
    const famsDesa = flattenRwMap(rwMap);
    const key = 'd:'+desa;
    return statRowHtml(desa, famsDesa, 0, key, ()=>
      `<tr><td colspan="6" style="padding:0;border-bottom:none;background:#F7FAF7;">
        <table style="margin:0;">${renderRwLevel(rwMap, key)}</table>
      </td></tr>`);
  }).join('');
}

function renderRwLevel(rwMap, parentKey){
  return Object.keys(rwMap).sort().map(rw=>{
    const rtMap = rwMap[rw];
    const famsRw = [].concat(...Object.values(rtMap));
    const key = parentKey+'>rw:'+rw;
    return statRowHtml('RW '+rw, famsRw, 1, key, ()=>
      `<tr><td colspan="6" style="padding:0;border-bottom:none;background:#F7FAF7;">
        <table style="margin:0;">${renderRtLevel(rtMap, key)}</table>
      </td></tr>`);
  }).join('');
}

function renderRtLevel(rtMap, parentKey){
  return Object.keys(rtMap).sort().map(rt=>{
    const famsRt = rtMap[rt];
    const key = parentKey+'>rt:'+rt;
    return statRowHtml('RT '+rt, famsRt, 2, key, ()=>
      `<tr><td colspan="6" style="padding:0;border-bottom:none;background:#F7FAF7;">
        <table style="margin:0;">${renderKkLevel(famsRt)}</table>
      </td></tr>`);
  }).join('');
}

function renderKkLevel(fams){
  return [...fams].sort((a,b)=>(a.kepala_keluarga||'').localeCompare(b.kepala_keluarga||'')).map(f=>{
    const r = computeIKS(f.indikator);
    return `<tr>
      <td style="padding-left:${14+3*20}px;">
        ${esc(f.kepala_keluarga||'(tanpa nama)')}${f.no_kk?` <span style="color:var(--ink-soft);font-size:11.5px;">&middot; KK: ${esc(f.no_kk)}</span>`:''}
      </td>
      <td>1</td>
      <td><span class="badge ${r.cls}">${r.score!==null?fmtPct(r.score):'—'}</span></td>
      <td>${r.cls==='sehat'?1:0}</td>
      <td>${r.cls==='pra'?1:0}</td>
      <td>${r.cls==='tidak'?1:0}</td>
    </tr>`;
  }).join('');
}

function buildAIPrompt(text){

Catatan kunjungan:
"""
${text}

Tugas: keluarkan HANYA satu objek JSON valid (tanpa teks lain, tanpa markdown, tanpa backtick) dengan struktur persis berikut:
{

  "no_kk": string,
  "alamat": {"jalan": string, "rt": string, "rw": string, "desa": string, "kecamatan": string},

Aturan penilaian indikator:

- "bersalin": hanya berlaku jika ada riwayat persalinan yang relevan; jika tidak ada ibu hamil/bersalin, isi "N".
- "imunisasi" dan "asi": hanya berlaku jika ada bayi/balita; jika tidak ada, isi "N".

Jika field tidak disebutkan dalam catatan, gunakan string kosong "" untuk teks, null untuk angka, dan array kosong [] jika tidak ada anggota yang disebut. Jangan mengarang NIK atau nomor KK. Balas hanya dengan JSON.`;
}

/* Memanggil AI dengan sepotong teks (catatan bebas ATAU baris Excel yang
   sudah diratakan jadi teks "Kolom: Nilai") dan mengembalikan objek
   keluarga terstruktur. Dipakai baik oleh Input dengan AI (catatan)
   maupun oleh Impor Excel, supaya logikanya konsisten satu tempat. */
async function extractFamilyFromText(text){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      model:"claude-sonnet-4-6",
      max_tokens: 1000,
      messages:[{role:"user", content: buildAIPrompt(text)}]
    })
  });
  const data = await response.json();
  let raw = (data.content||[]).map(c=>c.text||'').join('').trim();
  raw = raw.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const parsed = JSON.parse(raw);

  const fam = blankFamily();
  fam.kepala_keluarga = parsed.kepala_keluarga || '';
  fam.no_kk = parsed.no_kk || '';
  fam.alamat = Object.assign(fam.alamat, parsed.alamat||{});
  if(Array.isArray(parsed.anggota) && parsed.anggota.length){
    fam.anggota = parsed.anggota.map(a=>({
      nama:a.nama||'', umur:(a.umur===null||a.umur===undefined)?'':a.umur,
      jenis_kelamin:a.jenis_kelamin==='P'?'P':'L',
      hubungan:a.hubungan||'', nik:a.nik||''
    }));
  }
  fam.catatan = parsed.catatan || '';
  fam.flagged = {};
  INDICATORS.forEach(ind=>{
    const v = parsed.indikator ? parsed.indikator[ind.id] : 'N';
    if(v==='?'){ fam.indikator[ind.id]='N'; fam.flagged[ind.id]=true; }
    else if(v==='Y'||v==='T'||v==='N'){ fam.indikator[ind.id]=v; }
    else { fam.indikator[ind.id]='N'; }
  });
  return fam;
}

async function runAI(){
  const text = document.getElementById('ai-input').value.trim();
  state.aiText = text;
  if(!text){ state.aiError='Tulis atau tempel catatan terlebih dahulu.'; render(); return; }
  state.aiLoading = true; state.aiError=''; state.draftFamily=null;
  render();
  try{
    const fam = await extractFamilyFromText(text);
    state.draftFamily = fam;
    state.aiLoading = false;
    render();
  }catch(e){
    state.aiLoading = false;
    state.aiError = 'AI tidak berhasil memproses catatan ini. Anda tetap bisa mengisi manual di bawah.';
    render();
  }
}

        </div>
        <div class="actions">
          <button class="btn ghost small" data-excel-edit="${idx}">Ubah</button>
          <button class="btn danger small" data-excel-remove="${idx}">Hapus</button>
        </div>
      </div>`;
    }).join('')}
    <div class="form-actions" style="position:static;background:none;">
      <button class="btn" id="excel-save-all" ${okCount===0?'disabled':''}>Simpan ${okCount} Keluarga ke Data Keluarga</button>
      <button class="btn ghost" id="excel-discard">Batalkan Impor</button>
    </div>
  </div>` : ''}
  `;
}

async function handleExcelFile(file){
  state.excelError = ''; state.excelDrafts = []; state.excelRawRows = [];
  state.excelFileName = file.name;
  render();
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
    if(!rows.length){
      state.excelError = 'File tidak berisi baris data. Pastikan baris pertama adalah header kolom.';
      state.excelFileName = '';
    } else {
      state.excelRawRows = rows;
    }
  }catch(e){
    state.excelError = 'Gagal membaca file. Pastikan formatnya .xlsx, .xls, atau .csv.';
    state.excelFileName = '';
  }
  render();
}

async function processExcelWithAI(){
  state.excelLoading = true; state.excelError=''; state.excelDrafts=[];
  state.excelProgress = {current:0, total: state.excelRawRows.length};
  render();
  const drafts = [];
  for(let i=0;i<state.excelRawRows.length;i++){
    state.excelProgress.current = i+1;
    render();
    const row = state.excelRawRows[i];
    const rowText = rowToText(row);
    try{
      if(!rowText) throw new Error('empty row');
      const fam = await extractFamilyFromText(rowText);
      drafts.push({ok:true, fam, sourceRowLabel: rowText.slice(0,120)});
    }catch(e){
      const fam = blankFamily();
      fam.catatan = rowText;
      drafts.push({ok:false, fam, sourceRowLabel: rowText.slice(0,120) || `(baris ${i+1} kosong)`});
    }
  }
  state.excelDrafts = drafts;
  state.excelLoading = false;
  render();
}

function downloadExcelTemplate(){
  const header = [
    'Nama Kepala Keluarga','No KK','Alamat Jalan/Dusun','RT','RW','Desa/Kelurahan','Kecamatan',
    'Nama Anggota 1','Umur 1','JK 1 (L/P)','Hubungan 1',
    'Nama Anggota 2','Umur 2','JK 2 (L/P)','Hubungan 2',
    'KB','Bersalin di Faskes','Imunisasi Dasar Lengkap','ASI Eksklusif','Balita Dipantau',
    'TB Berobat Standar','Hipertensi Berobat Teratur','Gangguan Jiwa Diobati',
    'Tidak Merokok','Anggota JKN','Akses Air Bersih','Jamban Sehat',
    'Surveyor','Tanggal Kunjungan','Catatan'
  ];
  const sample = [
    'Sutrisno','3204xxxxxxxxxxxx','Jl. Anggrek No 12','03','05','Cibiru','',
    'Wati','34','P','Istri',
    'Dimas','6','L','Anak',
    'Ya','Ya','Ya','Tidak Berlaku','Tidak Berlaku',
    'Tidak Berlaku','Tidak Berlaku','Tidak Berlaku',
    'Ya','Ya','Ya','Ya',
    '','', 'Contoh baris — hapus/ganti sebelum diisi data asli'
  ];
  const ws = XLSX.utils.aoa_to_sheet([header, sample]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Data Keluarga');
  XLSX.writeFile(wb, 'Template_Data_Keluarga_PISPK.xlsx');
}

/* ============================= EVENTS ============================= */

function attachEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const v = el.getAttribute('data-nav');
      state.excelEditIndex = null;
      if(v==='form-new'){ state.draftFamily=null; state.editingId=null; state.view='form'; }
      else { state.view=v; }
      render();
    });
  });

  const modeToggle = document.querySelector('[data-action="toggle-mode"]');
  if(modeToggle) modeToggle.addEventListener('click', async ()=>{
    if(!state.sharedMode){
      const ok = confirm('Beralih ke Mode Tim akan membuat semua data terlihat oleh siapa pun yang membuka aplikasi ini. Lanjutkan?');
      if(!ok) return;
    }
    state.sharedMode = !state.sharedMode;
    state.loaded = false;
    render();
    await loadFamilies();
  });

  const searchInput = document.querySelector('[data-search]');
  if(searchInput) searchInput.addEventListener('input', e=>{ state.search = e.target.value; render(); document.querySelector('[data-search]').focus(); document.querySelector('[data-search]').selectionStart = document.querySelector('[data-search]').value.length; });

  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const f = state.families.find(x=>x.id===el.getAttribute('data-edit'));
      if(f){ state.draftFamily = JSON.parse(JSON.stringify(f)); state.editingId = f.id; state.excelEditIndex = null; state.view='form'; render(); }
    });
  });
  document.querySelectorAll('[data-delete]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.confirmDeleteId = el.getAttribute('data-delete'); render(); });
  });
  const cancelDel = document.querySelectorAll('[data-action="cancel-delete"]');
  cancelDel.forEach(el=> el.addEventListener('click', ()=>{ state.confirmDeleteId=null; render(); }));
  const confirmDel = document.querySelector('[data-action="confirm-delete"]');
  if(confirmDel) confirmDel.addEventListener('click', async ()=>{
    state.families = state.families.filter(f=>f.id!==state.confirmDeleteId);
    state.confirmDeleteId=null;
    render();
    await saveFamilies();
    showToast('Data keluarga dihapus.');
  });

  const rekapFilter = document.querySelector('[data-rekap-filter-desa]');
  if(rekapFilter) rekapFilter.addEventListener('change', e=>{ state.rekapFilterDesa = e.target.value; render(); });

  document.querySelectorAll('[data-rekap-toggle]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const key = el.getAttribute('data-rekap-toggle');
      state.rekapExpand[key] = !isRekapExpanded(key);
      render();
    });
  });
  const rekapExpandAll = document.querySelector('[data-action="rekap-expand-all"]');
  if(rekapExpandAll) rekapExpandAll.addEventListener('click', ()=>{ state.rekapDefaultExpand=true; state.rekapExpand={}; render(); });
  const rekapCollapseAll = document.querySelector('[data-action="rekap-collapse-all"]');
  if(rekapCollapseAll) rekapCollapseAll.addEventListener('click', ()=>{ state.rekapDefaultExpand=false; state.rekapExpand={}; render(); });

  const aiRun = document.getElementById('ai-run');
  if(aiRun) aiRun.addEventListener('click', runAI);
  const aiInputEl = document.getElementById('ai-input');
  if(aiInputEl) aiInputEl.addEventListener('input', e=>{ state.aiText = e.target.value; });

  const excelTemplateBtn = document.getElementById('excel-template');
  if(excelTemplateBtn) excelTemplateBtn.addEventListener('click', downloadExcelTemplate);
  const excelFileInput = document.getElementById('excel-file');
  if(excelFileInput) excelFileInput.addEventListener('change', e=>{
    const file = e.target.files && e.target.files[0];
    if(file) handleExcelFile(file);
  });
  const excelProcessBtn = document.getElementById('excel-process');
  if(excelProcessBtn) excelProcessBtn.addEventListener('click', processExcelWithAI);
  document.querySelectorAll('[data-excel-edit]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = parseInt(el.getAttribute('data-excel-edit'),10);
      state.draftFamily = JSON.parse(JSON.stringify(state.excelDrafts[idx].fam));
      state.excelEditIndex = idx;
      state.editingId = null;
      state.view = 'form';
      render();
    });
  });
  document.querySelectorAll('[data-excel-remove]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = parseInt(el.getAttribute('data-excel-remove'),10);
      state.excelDrafts.splice(idx,1);
      render();
    });
  });
  const excelSaveAll = document.getElementById('excel-save-all');
  if(excelSaveAll) excelSaveAll.addEventListener('click', async ()=>{
    const toSave = state.excelDrafts.filter(d=>d.ok).map(d=>d.fam);
    toSave.forEach(fam=>{
      fam.updated_at = Date.now();
      const existingIdx = state.families.findIndex(f=>f.id===fam.id);
      if(existingIdx>=0) state.families[existingIdx] = fam;
      else state.families.push(fam);
    });
    const count = toSave.length;
    state.excelDrafts = []; state.excelRawRows = []; state.excelFileName = '';
    state.view = 'list';
    render();
    await saveFamilies();
    showToast(`${count} data keluarga berhasil diimpor.`);
  });
  const excelDiscard = document.getElementById('excel-discard');
  if(excelDiscard) excelDiscard.addEventListener('click', ()=>{
    state.excelDrafts = []; state.excelRawRows = []; state.excelFileName = ''; state.excelError='';
    render();
  });

  const addMemberBtn = document.getElementById('add-member');
  if(addMemberBtn) addMemberBtn.addEventListener('click', ()=>{
    const fam = state.draftFamily || blankFamily();
    fam.anggota.push({nama:'', umur:'', jenis_kelamin:'L', hubungan:'', nik:''});
    state.draftFamily = fam;
    render();
  });
  document.querySelectorAll('[data-remove-member]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = parseInt(el.getAttribute('data-remove-member'),10);
      const fam = collectFormIntoDraft(false);
      if(fam.anggota.length>1) fam.anggota.splice(idx,1);
      state.draftFamily = fam;
      render();
    });
  });

  const form = document.getElementById('family-form');
  if(form) form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fam = collectFormIntoDraft(true);
    if(state.excelEditIndex !== null){
      state.excelDrafts[state.excelEditIndex] = {ok:true, fam, sourceRowLabel: state.excelDrafts[state.excelEditIndex].sourceRowLabel};
      state.draftFamily = null; state.excelEditIndex = null; state.view = 'excel';
      render();
      showToast('Baris diperbarui. Klik "Simpan" saat semua baris sudah siap.');
      return;
    }
    const existingIdx = state.families.findIndex(f=>f.id===fam.id);
    fam.updated_at = Date.now();
    if(existingIdx>=0) state.families[existingIdx] = fam;
    else state.families.push(fam);
    state.draftFamily = null; state.editingId = null; state.view='list';
    render();
    await saveFamilies();
    showToast('Data keluarga tersimpan.');
  });
}

function collectFormIntoDraft(clearFlags){
  const form = document.getElementById('family-form');
  const fam = state.draftFamily ? JSON.parse(JSON.stringify(state.draftFamily)) : blankFamily();
  if(!form) return fam;
  const fd = new FormData(form);
  fam.id = fd.get('family_id') || fam.id;
  fam.kepala_keluarga = fd.get('kepala_keluarga') || '';
  fam.no_kk = fd.get('no_kk') || '';
  fam.alamat = {
    jalan: fd.get('alamat_jalan')||'', rt: fd.get('alamat_rt')||'', rw: fd.get('alamat_rw')||'',
    desa: fd.get('alamat_desa')||'', kecamatan: fd.get('alamat_kec')||''
  };
  fam.surveyor = fd.get('surveyor')||'';
  fam.tanggal = fd.get('tanggal')||'';
  fam.catatan = fd.get('catatan')||'';

  const rows = form.querySelectorAll('[data-member-row]');
  fam.anggota = Array.from(rows).map(row=>({
    nama: row.querySelector('[data-m="nama"]').value,
    umur: row.querySelector('[data-m="umur"]').value,
    jenis_kelamin: row.querySelector('[data-m="jenis_kelamin"]').value,
    hubungan: row.querySelector('[data-m="hubungan"]').value,
    nik: row.querySelector('[data-m="nik"]').value,
  }));

  INDICATORS.forEach(ind=>{
    const checked = form.querySelector(`input[name="ind_${ind.id}"]:checked`);
    fam.indikator[ind.id] = checked ? checked.value : (fam.indikator[ind.id]||'N');
  });
  if(clearFlags) fam.flagged = {};
  return fam;
}

/* ============================= INIT ============================= */
loadFamilies();
</script>
